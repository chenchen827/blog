<svg width="100%" height="100%" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 无发光效果，保持纯线稿 -->
  </defs>

  <!-- ==================== 背景星点（黑色） ==================== -->
  <g fill="#000000" opacity="0.3">
    <circle cx="120" cy="150" r="1.5"/>
    <circle cx="350" cy="80" r="1"/>
    <circle cx="600" cy="200" r="2"/>
    <circle cx="950" cy="100" r="1.5"/>
    <circle cx="1300" cy="180" r="1"/>
    <circle cx="1450" cy="120" r="2"/>
    <circle cx="80" cy="400" r="1"/>
    <circle cx="250" cy="300" r="1.5"/>
    <circle cx="450" cy="350" r="1"/>
    <circle cx="1150" cy="250" r="2"/>
    <circle cx="1400" cy="350" r="1.5"/>
    <circle cx="150" cy="650" r="1.5"/>
    <circle cx="300" cy="750" r="1"/>
    <circle cx="500" cy="850" r="2"/>
    <circle cx="1100" cy="700" r="1.5"/>
    <circle cx="1250" cy="850" r="1"/>
    <circle cx="1450" cy="700" r="2"/>
    <circle cx="700" cy="950" r="1"/>
    <circle cx="900" cy="900" r="1.5"/>
    <circle cx="50" cy="850" r="1"/>
    <circle cx="1550" cy="500" r="1.5"/>
    <circle cx="400" cy="550" r="1"/>
    <circle cx="750" cy="650" r="1.5"/>
  </g>

  <!-- ==================== 背景星座虚线 ==================== -->
  <g fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4 4" opacity="0.25">
    <polyline points="120,150 250,300 450,350 600,200"/>
    <polyline points="950,100 1150,250 1300,180"/>
    <polyline points="150,650 300,750 500,850 700,950"/>
    <polyline points="1100,700 1250,850 1450,700"/>
    <polyline points="1400,350 1450,120 1550,500"/>
  </g>

  <!-- ==================== 轨道层（静态） ==================== -->
  <g fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35">
    <!-- 水星轨道 -->
    <ellipse cx="800" cy="500" rx="90" ry="35"/>
    <!-- 金星轨道 -->
    <ellipse cx="800" cy="500" rx="140" ry="55"/>
    <!-- 地球轨道 -->
    <ellipse cx="800" cy="500" rx="200" ry="80"/>
    <!-- 火星轨道 -->
    <ellipse cx="800" cy="500" rx="280" ry="110"/>
    <!-- 木星轨道 -->
    <ellipse cx="800" cy="500" rx="420" ry="160"/>
    <!-- 土星轨道 -->
    <ellipse cx="800" cy="500" rx="580" ry="220"/>
    <!-- 天王星轨道 -->
    <ellipse cx="800" cy="500" rx="750" ry="280"/>
    <!-- 海王星轨道 -->
    <ellipse cx="800" cy="500" rx="950" ry="350"/>
  </g>

  <!-- ==================== 太阳（纯黑实心圆，无光线） ==================== -->
  <circle cx="800" cy="500" r="28" fill="#000000"/>

  <!-- ==================== 行星动画层 ==================== -->
  
  <!-- 水星 / Mercury（从右侧出发） -->
  <g>
    <circle cx="0" cy="0" r="4" fill="#000000" opacity="0.9"/>
    <text x="15" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Mercury</text>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="0"
      path="M 890,500 a 90,35 0 1,0 -180,0 a 90,35 0 1,0 180,0"/>
  </g>

  <!-- 金星 / Venus（从底部出发） -->
  <g>
    <circle cx="0" cy="0" r="6" fill="#000000" opacity="0.9"/>
    <text x="18" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Venus</text>
    <animateMotion dur="10s" repeatCount="indefinite" rotate="0"
      path="M 800,555 a 140,55 0 1,0 0,-110 a 140,55 0 1,0 0,110"/>
  </g>

  <!-- 地球 / Earth + 月球 / Moon（从左侧出发） -->
  <g>
    <!-- 地球本体 -->
    <circle cx="0" cy="0" r="7" fill="#000000" opacity="0.9"/>
    <text x="18" y="-10" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Earth</text>
    
    <!-- 月球绕地球旋转 -->
    <g>
      <circle cx="18" cy="0" r="2.5" fill="#000000" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
    </g>
    
    <animateMotion dur="16s" repeatCount="indefinite" rotate="0"
      path="M 600,500 a 200,80 0 1,0 400,0 a 200,80 0 1,0 -400,0"/>
  </g>

  <!-- 火星 / Mars（从顶部出发） -->
  <g>
    <circle cx="0" cy="0" r="5" fill="#000000" opacity="0.9"/>
    <text x="15" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Mars</text>
    <animateMotion dur="24s" repeatCount="indefinite" rotate="0"
      path="M 800,390 a 280,110 0 1,0 0,220 a 280,110 0 1,0 0,-220"/>
  </g>

  <!-- 木星 / Jupiter（从右侧出发） -->
  <g>
    <circle cx="0" cy="0" r="12" fill="#000000" opacity="0.9"/>
    <text x="20" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Jupiter</text>
    <animateMotion dur="40s" repeatCount="indefinite" rotate="0"
      path="M 1220,500 a 420,160 0 1,0 -840,0 a 420,160 0 1,0 840,0"/>
  </g>

  <!-- 土星 / Saturn + 光环（从底部出发） -->
  <g>
    <circle cx="0" cy="0" r="10" fill="#000000" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="22" ry="6" transform="rotate(-20)" fill="none" stroke="#000000" stroke-width="2" opacity="0.8"/>
    <text x="28" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Saturn</text>
    <animateMotion dur="60s" repeatCount="indefinite" rotate="0"
      path="M 800,720 a 580,220 0 1,0 0,-440 a 580,220 0 1,0 0,440"/>
  </g>

  <!-- 天王星 / Uranus（从左侧出发） -->
  <g>
    <circle cx="0" cy="0" r="9" fill="#000000" opacity="0.9"/>
    <text x="18" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Uranus</text>
    <animateMotion dur="80s" repeatCount="indefinite" rotate="0"
      path="M 50,500 a 750,280 0 1,0 1500,0 a 750,280 0 1,0 -1500,0"/>
  </g>

  <!-- 海王星 / Neptune（从顶部出发） -->
  <g>
    <circle cx="0" cy="0" r="9" fill="#000000" opacity="0.9"/>
    <text x="18" y="5" fill="#000000" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" opacity="0.8">Neptune</text>
    <animateMotion dur="100s" repeatCount="indefinite" rotate="0"
      path="M 800,150 a 950,350 0 1,0 0,700 a 950,350 0 1,0 0,-700"/>
  </g>

</svg>